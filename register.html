<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PrajiBi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  
  <header>
    <div class="container nav-bar">
      <a href="index.html" class="logo">PRAJIBI</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="btn btn-small">Register</a>
      </nav>
    </div>
  </header>

  
  <main class="auth-container">
    <form class="form-box" action="index.html" method="get">
      <h2>Create Account</h2>
      <p class="form-subtitle">Join PrajiBi and start shopping.</p>

      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

    
      <label>Gender</label>
      <div class="radio-group">
        <label class="checkbox"><input type="radio" name="gender" value="female"> Female</label>
        <label class="checkbox"><input type="radio" name="gender" value="male"> Male</label>
        <label class="checkbox"><input type="radio" name="gender" value="other"> Other</label>
      </div>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Enter password again" minlength="8" required>

      <label class="checkbox">
        <input type="checkbox" name="terms" required> I agree to the terms and conditions
      </label>

      <button type="submit" class="btn btn-full">Register</button>

      <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </main>

  
  <footer>
    <p>&copy; 2026 PrajiBi. All rights reserved.</p>
  </footer>

</body>
</html>
