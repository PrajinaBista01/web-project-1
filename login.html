<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PrajiBi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  
  <header>
    <div class="container nav-bar">
      <a href="index.html" class="logo">PRAJIBI</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="btn btn-small">Register</a>
      </nav>
    </div>
  </header>

  
  <main class="auth-container">
    <form class="form-box" action="index.html" method="get">
      <h2>Login</h2>
      <p class="form-subtitle">Welcome back! Please login to your account.</p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <div class="form-row">
        <label class="checkbox">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-full">Login</button>

      <p class="form-footer">Don't have an account? <a href="register.html">Register here</a></p>
    </form>
  </main>


  <footer>
    <p>&copy; 2026 PrajiBi. All rights reserved.</p>
  </footer>

</body>
</html>
